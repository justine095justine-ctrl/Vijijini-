<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOKO LA VIJI 🛒</title>
<style>
body{font-family:'Segoe UI', Arial;margin:0;padding:10px;background:#fdf8f2} /* Background ya Beige ya udongo */
.header{background:linear-gradient(135deg, #166534, #16a34a);color:white;padding:18px;border-radius:15px;text-align:center;margin-bottom:15px;box-shadow:0 4px 15px rgba(22,101,52,0.2)}
.header h1{margin:0;font-size:26px}
.box{background:#ffffff;padding:18px;border-radius:15px;max-width:700px;margin:12px auto;box-shadow:0 4px 15px rgba(22,101,52,0.08);border:1px solid #dcfce7}
input,textarea,select{width:95%;padding:12px;margin:8px 0;border:2px solid #dcfce7;border-radius:10px;background:#f0fdf4;font-size:15px}
input:focus, textarea:focus{outline:none;border-color:#16a34a;background:white}
button{background:linear-gradient(135deg, #16a34a, #15803d);color:white;padding:14px 20px;border:none;border-radius:10px;cursor:pointer;width:100%;margin:8px 0;font-weight:bold;font-size:16px}
button:hover{transform:scale(1.02)}
.btn-danger{background:linear-gradient(135deg, #dc2626, #b91c1c)}
.product{display:flex;gap:15px;border:2px solid #dcfce7;padding:15px;margin:15px 0;border-radius:12px;background:#ffffff}
.product img{width:120px;height:120px;object-fit:cover;border-radius:10px;border:2px solid #f0fdf4}
.product-info{flex:1}
.price{color:#166534;font-weight:bold;font-size:22px}
.category-tag{background:#dcfce7;color:#166534;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:bold}
.hidden{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(320px, 1fr));gap:15px}
.seller-info{font-size:12px;color:#4b5563;margin-top:8px;background:#f0fdf4;padding:6px;border-radius:6px}
h2{color:#166534}
</style>
</head>
<body>
<div class="header">
<h1>SOKO LA VIJI 🛒</h1>
<p>Nunua na Uuza. Tunakata 5% tu!</p>
</div>

<div class="box" id="loginBox">
<h2>Jisajili / Ingia</h2>
<input type="email" id="email" placeholder="Barua pepe">
<input type="password" id="pass" placeholder="Nywila">
<button onclick="jisajili()">Jisajili</button>
<button style="background:linear-gradient(135deg, #2563eb, #1d4ed8)" onclick="ingia()">Ingia</button>
<p id="msg" style="text-align:center;font-weight:bold"></p>
</div>

<div id="sokoBox" class="hidden">
<div class="box">
<p>Karibu: <b id="userEmail"></b> | Mauzo: <b id="mauzo">0 TZS</b>
<button class="btn-danger" onclick="toka()" style="width:120px;float:right">Toka</button></p>
</div>

<div class="box">
<h2>Weka Bidhaa Yako Mpya</h2>
<input type="text" id="jina" placeholder="Jina la Bidhaa">
<input type="number" id="bei" placeholder="Bei TZS">
<select id="category">
  <option value="Nguo">Nguo</option>
  <option value="Viatu">Viatu</option>
  <option value="Simu">Simu na Vifaa</option>
  <option value="Chakula">Chakula</option>
  <option value="Huduma">Huduma</option>
  <option value="Nyingine">Nyingine</option>
</select>
<input type="text" id="picha" placeholder="Link ya picha kutoka Google">
<textarea id="maelezo" placeholder="Elezea bidhaa. Weka namba yako hapa pia"></textarea>
<button onclick="ongezaBidhaa()">Weka Soko - BURE</button>
</div>

<div class="box">
<h2>Tafuta na Chuja</h2>
<input type="text" id="searchBox" placeholder="Tafuta bidhaa..." onkeyup="onyeshaBidhaa()">
</div>

<div class="box">
<h2>Bidhaa Zilizopo</h2>
<div id="orodha" class="grid"></div>
</div>
</div>

<script>
let bidhaa = JSON.parse(localStorage.getItem('bidhaa')) || [];
let watumiaji = JSON.parse(localStorage.getItem('watumiaji')) || {};
let currentUser = localStorage.getItem('user');

function jisajili(){
  const email = document.getElementById('email').value;
  const pass = document.getElementById('pass').value;
  if(email && pass){
    watumiaji[email] = pass;
    localStorage.setItem('watumiaji', JSON.stringify(watumiaji));
    msg('Umejisajili! Sasa Ingia','green');
  } else { msg('Jaza vyote','red') }
}

function ingia(){
  const email = document.getElementById('email').value;
  const pass = document.getElementById('pass').value;
  if(watumiaji[email] === pass){
    currentUser = email;
    localStorage.setItem('user', email);
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('sokoBox').classList.remove('hidden');
    document.getElementById('userEmail').innerText = email;
    hesabuMauzo();
    onyeshaBidhaa();
  } else { msg('Email au Nywila sio sahihi','red') }
}

function toka(){
  localStorage.removeItem('user');
  currentUser = null;
  document.getElementById('loginBox').classList.remove('hidden');
  document.getElementById('sokoBox').classList.add('hidden');
}

function msg(text,color){ document.getElementById('msg').innerHTML = text; document.getElementById('msg').style.color = color; }

function ongezaBidhaa(){
  const jina = document.getElementById('jina').value;
  const bei = document.getElementById('bei').value;
  const category = document.getElementById('category').value;
  const picha = document.getElementById('picha').value;
  const maelezo = document.getElementById('maelezo').value;
  if(jina && bei){
    bidhaa.push({id:Date.now(), jina, bei, category, picha, maelezo, mmiliki:currentUser});
    localStorage.setItem('bidhaa', JSON.stringify(bidhaa));
    onyeshaBidhaa();
    alert('Bidhaa imeongezwa!');
  }
}

function futaBidhaa(id){
  if(confirm('Una uhakika unataka kufuta?')){
    bidhaa = bidhaa.filter(b => b.id!== id);
    localStorage.setItem('bidhaa', JSON.stringify(bidhaa));
    onyeshaBidhaa();
    hesabuMauzo();
  }
}

function hesabuMauzo(){
  let total = bidhaa.filter(b => b.mmiliki === currentUser).reduce((sum, b) => sum + Number(b.bei), 0);
  document.getElementById('mauzo').innerText = total.toLocaleString() + ' TZS';
}

function onyeshaBidhaa(){
  const search = document.getElementById('searchBox').value.toLowerCase();
  let filtered = bidhaa.filter(b => b.jina.toLowerCase().includes(search) || b.maelezo.toLowerCase().includes(search));

  let html = '';
  filtered.forEach(b => {
    const niYangu = b.mmiliki === currentUser;
    const category = b.category || "Nyingine";
    const picha = b.picha || "https://via.placeholder.com/120/16a34a/ffffff?text=VIJIJINI";
    html += `<div class="product">
      <img src="${picha}">
      <div class="product-info">
        <span class="category-tag">${category}</span>
        <h3>${b.jina}</h3>
        <p class="price">${Number(b.bei).toLocaleString()} TZS</p>
        <p>${b.maelezo}</p>
        ${niYangu? `<p class="seller-info"><b>Imeli yako:</b> ${b.mmiliki}</p>` : `<p class="seller-info"><b>Muuzaji:</b> Amefichwa</p>`}
        <button onclick="nunua('${b.jina}')">NUNUA KWA WHATSAPP</button>
        ${niYangu? `<button class="btn-danger" onclick="futaBidhaa(${b.id})">Futa Bidhaa Yangu</button>` : ''}
      </div>
    </div>`;
  });
  document.getElementById('orodha').innerHTML = html || '<p>Hakuna bidhaa bado. Weka ya kwanza!</p>';
}

function nunua(jina){
  window.open('https://wa.me/255653243898?text=Niaje%20nataka%20kunua%20' + jina + '%20kwenye%20SOKO%20LA%20VIJI','_blank');
}

if(currentUser){
  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('sokoBox').classList.remove('hidden');
  document.getElementById('userEmail').innerText = currentUser;
  hesabuMauzo();
  onyeshaBidhaa();
}
</script>
</body>
</html>
