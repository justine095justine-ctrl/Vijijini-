<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<title>VIJI APP - Ingia</title>
<style>
body{background:#0f172a;color:white;font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.box{background:#1e293b;padding:25px;border-radius:15px;width:90%;max-width:350px}
h2{color:#60a5fa;text-align:center}
p{text-align:center;color:#94a3b8}
input{width:93%;padding:12px;margin:10px 0;border-radius:8px;border:1px solid #334155;background:#0f172a;color:white}
.btn{width:100%;padding:14px;background:linear-gradient(135deg, #3b82f6, #2563eb);color:white;border:none;border-radius:10px;font-weight:bold;font-size:16px}
.note{background:#1e3a8a;padding:10px;border-radius:8px;text-align:center;margin-bottom:15px;color:#60a5fa}
</style>
</head>
<body>
<div class="box">
<div class="note">Tunakata 5% tu kwenye kila mauzo</div>
<h2>Jisajili / Ingia</h2>
<p>Karibu tena</p>
<input type="text" id="namba" value="+255653243898">
<input type="password" id="neno" placeholder="Andika Nywila yako">
<button class="btn" onclick="ingia()">Ingia</button>
</div>

<script>
function ingia(){
  let namba = document.getElementById('namba').value;
  let neno = document.getElementById('neno').value;
  if(neno.length < 4){ alert('Weka nywila sahihi'); return; }
  localStorage.setItem('vijiUser', namba);
  window.location = 'index.html'; // Mpeleke Menu Kuu
}
</script>
</body>
</html>
