<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIJI SKILLS</title>
<style>
body{background:#0f172a;color:white;padding:20px;font-family:Arial}
h2{text-align:center;color:#f59e0b}
.wallet-box{background:#1e293b;padding:15px;border-radius:12px;text-align:center;margin-bottom:15px}
.wallet-box span{color:#10b981;font-size:20px;font-weight:bold}
.card{background:#1e293b;padding:15px;border-radius:12px;margin:15px 0;text-align:center;position:relative}
.card h3{color:#10b981;margin:5px 0}
.card p{margin:5px 0}
.card.expiry{color:#ef4444;font-size:12px}
.card img{width:100%;border-radius:10px;margin-bottom:10px;height:180px;object-fit:cover}
.call-btn{background:#10b981;color:white;padding:12px;text-align:center;border-radius:8px;text-decoration:none;display:block;margin-top:10px;font-weight:bold}
.call-btn.disabled{background:#64748b;cursor:not-allowed}
.add-btn{background:#f59e0b;color:white;padding:15px;text-align:center;border-radius:12px;display:block;margin:10px 0;font-weight:bold;border:none;width:100%;font-size:16px;cursor:pointer}
.badge{background:#10b981;color:#0f172a;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:bold}
.form-box{background:#1e293b;padding:20px;border-radius:12px;margin:20px 0;display:none}
input{width:93%;padding:12px;margin:8px 0;border-radius:8px;border:none;background:#334155;color:white}
.score{color:#ec4899;font-weight:bold;font-size:18px;text-align:center}
.btn-delete{position:absolute;top:10px;right:10px;background:#ef4444;color:white;border:none;padding:5px 10px;border-radius:5px;cursor:pointer}
</style>
</head>
<body>

<h2>🔧 VIJI SKILLS <span class="badge">2000/MWEZI</span></h2>

<div class="wallet-box">
  Wallet yako: <span id="wallet">0</span> TZS <br>
  Alama zako: <span id="alama" style="color:#ec4899">0</span>
</div>

<button class="add-btn" onclick="onyeshaFomu()">+ JIUNGE NA VIJI SKILLS - 2000 TZS/MWEZI</button>

<div class="form-box" id="fomuSkill">
  <h3>Ongeza Fundi Mpya</h3>
  <p style="color:#f59e0b;text-align:center">Ada: 2000 TZS kwa mwezi 1<br>Ukishapata mteja: 500 TZS<br>Mteja atalipa: 500 TZS</p>
  <input type="text" id="jina" placeholder="Jina la Fundi">
  <input type="text" id="ufundi" placeholder="Anajua kazi gani? Mf: Umeme, Ufundi">
  <input type="text" id="mkoa" placeholder="Mkoa: Mf. Mwanza">
  <input type="text" id="namba" placeholder="Namba ya Simu / WhatsApp 2557...">
  <input type="file" id="picha" accept="image/*">
  <button class="add-btn" style="background:#10b981" onclick="hifadhiSkill()">LIPA 2000 NA JIUNGE</button>
  <button class="add-btn" style="background:#64748b" onclick="fichaFomu()">FUNGA</button>
</div>

<div id="orodhaSkills"></div>

<a href="index.html" style="color:#94a3b8">← Rudi Nyuma</a>

<script>
let userID = localStorage.getItem('vijiUserID') || Date.now();
localStorage.setItem('vijiUserID', userID);
let wallet = parseInt(localStorage.getItem('vijiWallet')) || 0;
let alama = parseInt(localStorage.getItem('vijiAlama')) || 0;
document.getElementById('wallet').innerText = wallet.toLocaleString();
document.getElementById('alama').innerText = alama;

function onyeshaFomu(){document.getElementById('fomuSkill').style.display='block';}
function fichaFomu(){document.getElementById('fomuSkill').style.display='none';}

function ongezaAlama(pt){
  alama += pt;
  localStorage.setItem('vijiAlama', alama);
  document.getElementById('alama').innerText = alama;
}

// ANGA KAMA SUBSCRIPTION IMEKWISHA
function sikuZilizobaki(expiry){
  let leo = new Date().getTime();
  let diff = expiry - leo;
  return Math.ceil(diff / (1000 * 60 * 60 * 24));
}

// PAKIA FUNDI
function pakiaSkills(){
  let skills = JSON.parse(localStorage.getItem('vijiSkills')) || [];
  let div = document.getElementById('orodhaSkills');
  div.innerHTML = '';

  if(skills.length == 0){
    div.innerHTML = '<p style="text-align:center;color:#94a3b8">Bado hakuna fundi. Jiunge kwa 2000 tu kwa mwezi!</p>';
  }

  skills.forEach(s => {
    let btnFuta = (s.mwenyeSkill == userID)? `<button class="btn-delete" onclick="futaSkill(${s.id})">X</button>` : '';
    let siku = sikuZilizobaki(s.expiry);
    let active = siku > 0;
    let btnClass = active? 'call-btn' : 'call-btn disabled';
    let btnText = active? 'WASILIANA - Mteja alipa 500' : `IMEKWISHA - Siku ${siku}`;

    div.innerHTML += `
    <div class="card">
      ${btnFuta}
      <img src="${s.picha}" alt="${s.jina}">
      <h3>${s.jina}</h3>
      <p><b>Kazi:</b> ${s.ufundi}</p>
      <p><b>Mkoa:</b> ${s.mkoa}</p>
      <p class="expiry">Inaisha baada ya: ${siku} siku</p>
      <a href="${active? 'https://wa.me/'+s.namba : '#'}" target="_blank" class="${btnClass}" onclick="${active? 'kataKamisheni('+s.id+')' : 'return false'}">${btnText}</a>
    </div>
    `;
  });
}

// KATA 500 KWA FUNDI + 500 KWA MTEJA
function kataKamisheni(skillID){
  let skills = JSON.parse(localStorage.getItem('vijiSkills')) || [];
  let skill = skills.find(s => s.id == skillID);

  if(!skill.kamisheniYaLeo){
    if(wallet < 500){
      alert('Wallet yako haina 500 TZS ya kamisheni');
      return;
    }
    wallet = wallet - 500; // HII NI YA FUNDI
    localStorage.setItem('vijiWallet', wallet);
    document.getElementById('wallet').innerText = wallet.toLocaleString();

    skill.kamisheniYaLeo = true; // Kata mara 1 tu kwa siku
    localStorage.setItem('vijiSkills', JSON.stringify(skills));

    alert('✅ Kamisheni ya 500 TZS imetoka kwako. Mteja atalipishwa 500 pia');
  }
  ongezaAlama(2);
}

// HIFADHI FUNDI MPYA - KATA 2000
function hifadhiSkill(){
  let jina = document.getElementById('jina').value;
  let ufundi = document.getElementById('ufundi').value;
  let mkoa = document.getElementById('mkoa').value;
  let namba = document.getElementById('namba').value;
  let pichaFile = document.getElementById('picha').files[0];
  let ada = 2000;

  if(!jina ||!ufundi ||!mkoa ||!namba ||!pichaFile){alert('Tafadhali jaza yote'); return;}
  if(wallet < ada){alert('Wallet yako haina 2000 TZS. Ongea na Admin akuwekee pesa'); return;}

  wallet = wallet - ada;
  localStorage.setItem('vijiWallet', wallet);
  document.getElementById('wallet').innerText = wallet.toLocaleString();

  let reader = new FileReader();
  reader.onload = function(e){
    let skills = JSON.parse(localStorage.getItem('vijiSkills')) || [];
    let mwezi1 = new Date().getTime() + (30 * 24 * 60 * 60 * 1000); // Mwezi 1
    let skillMpya = {
      id: Date.now(), jina: jina, ufundi: ufundi, mkoa: mkoa, namba: namba,
      picha: e.target.result, mwenyeSkill: userID, expiry: mwezi1, kamisheniYaLeo: false
    };
    skills.push(skillMpya);
    localStorage.setItem('vijiSkills', JSON.stringify(skills));

    ongezaAlama(10);
    alert('✅ Umejiunga kwa mwezi 1! 2000 TZS imetoka. +10 alama');
    document.getElementById('jina').value=''; document.getElementById('ufundi').value='';
    document.getElementById('mkoa').value=''; document.getElementById('namba').value=''; document.getElementById('picha').value='';
    fichaFomu(); pakiaSkills();
  }
  reader.readAsDataURL(pichaFile);
}

// FUTA SKILL
function futaSkill(id){
  if(confirm('Una uhakika? Subscription haijarejeshwa.')){
    let skills = JSON.parse(localStorage.getItem('vijiSkills')) || [];
    skills = skills.filter(s => s.id!= id);
    localStorage.setItem('vijiSkills', JSON.stringify(skills));
    pakiaSkills();
  }
}

pakiaSkills();
</script>
</body>
</html>
