<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIJI SKILLS</title>
<style>
body{background:#0f172a;color:white;padding:20px;font-family:Arial}
h2{text-align:center;color:#8b5cf6}
.card{background:#1e293b;padding:15px;border-radius:12px;margin:15px 0}
.card h3{color:#f59e0b;margin:5px 0}
.card img{width:100%;border-radius:10px;margin-bottom:10px;height:200px;object-fit:cover}
.whatsapp-btn{background:#25D366;color:white;padding:12px;text-align:center;border-radius:8px;text-decoration:none;display:block;margin-top:10px;font-weight:bold}
.add-btn{background:#10b981;color:white;padding:15px;text-align:center;border-radius:12px;display:block;margin:20px 0;font-weight:bold;border:none;width:100%;font-size:16px;cursor:pointer}
.form-box{background:#1e293b;padding:20px;border-radius:12px;margin:20px 0;display:none}
input, textarea{width:93%;padding:12px;margin:8px 0;border-radius:8px;border:none;background:#334155;color:white}
</style>
</head>
<body>

<h2>📚 VIJI SKILLS</h2>
<p style="text-align:center">Nunua/Uza ujuzi wako hapa</p>

<button class="add-btn" onclick="onyeshaFomu()">+ ONGEZA SKILL MPYA</button>

<!-- FOMU YA KUONGEZA SKILL -->
<div class="form-box" id="fomuSkill">
  <h3>Ongeza Huduma Yako</h3>
  <input type="text" id="jina" placeholder="Jina la Huduma. Mf: Fundisha Kiingereza">
  <input type="text" id="jinaLako" placeholder="Jina lako - Mkoa. Mf: Amina - Mwanza">
  <input type="number" id="bei" placeholder="Bei TZS">
  <input type="text" id="muhtasari" placeholder="Maelezo mafupi. Mf: 5000 / Saa">
  <input type="file" id="picha" accept="image/*">
  <button class="add-btn" style="background:#8b5cf6" onclick="hifadhiSkill()">HIFADHI SKILL</button>
  <button class="add-btn" style="background:#64748b" onclick="fichaFomu()">FUNGA</button>
</div>

<!-- HAPA NDIO SKILLS ZITAONEKANA -->
<div id="orodhaSkills"></div>

<a href="index.html" style="color:#94a3b8">← Rudi Nyuma</a>

<script>
let nambaYangu = "255 653 243 898"; // BADILI NA NAMBA YAKO

// ONYESHA/FICHA FOMU
function onyeshaFomu(){document.getElementById('fomuSkill').style.display='block';}
function fichaFomu(){document.getElementById('fomuSkill').style.display='none';}

// PAKIA SKILLS ZILIZOHIFADHIWA
function pakiaSkills(){
  let skills = JSON.parse(localStorage.getItem('vijiSkills')) || [];
  let div = document.getElementById('orodhaSkills');
  div.innerHTML = '';
  
  if(skills.length == 0){
    div.innerHTML = '<p style="text-align:center;color:#94a3b8">Hakuna skill bado. Bonyeza ONGEZA SKILL</p>';
  }
  
  skills.forEach(s => {
    div.innerHTML += `
    <div class="card">
      <img src="${s.picha}" alt="${s.jina}">
      <h3>${s.jina}</h3>
      <p>${s.jinaLako}</p>
      <p><b>Bei: ${parseInt(s.bei).toLocaleString()} TZS / ${s.muhtasari}</b></p>
      <a href="https://wa.me/${nambaYangu}?text=Habari%20nahusika%20na%20${s.jina}" class="whatsapp-btn" onclick="hifadhiMauzo('${s.jina}', '${s.bei}')">Wasiliana WhatsApp</a>
    </div>
    `;
  });
}

// HIFADHI SKILL MPYA
function hifadhiSkill(){
  let jina = document.getElementById('jina').value;
  let jinaLako = document.getElementById('jinaLako').value;
  let bei = document.getElementById('bei').value;
  let muhtasari = document.getElementById('muhtasari').value;
  let pichaFile = document.getElementById('picha').files[0];
  
  if(!jina ||!jinaLako ||!bei ||!muhtasari ||!pichaFile){alert('Tafadhali jaza yote'); return;}
  
  let reader = new FileReader();
  reader.onload = function(e){
    let skills = JSON.parse(localStorage.getItem('vijiSkills')) || [];
    let skillMpya = {
      id: Date.now(),
      jina: jina,
      jinaLako: jinaLako,
      bei: bei,
      muhtasari: muhtasari,
      picha: e.target.result // Hii ndio inahifadhi picha kwenye localStorage
    };
    skills.push(skillMpya);
    localStorage.setItem('vijiSkills', JSON.stringify(skills));
    
    alert('✅ Skill imeongezwa!');
    document.getElementById('jina').value='';
    document.getElementById('jinaLako').value='';
    document.getElementById('bei').value='';
    document.getElementById('muhtasari').value='';
    document.getElementById('picha').value='';
    fichaFomu();
    pakiaSkills();
  }
  reader.readAsDataURL(pichaFile);
}

// HIFADHI MAUZO KWENDA ADMIN
function hifadhiMauzo(bidhaa, bei){
  let mauzo = JSON.parse(localStorage.getItem('vijiMauzo')) || [];
  let mauzoMpya = {
    id: Date.now(),
    bidhaa: bidhaa,
    bei: bei,
    tarehe: new Date().toLocaleString('sw-TZ'),
    status: 'Inasubiri'
  };
  mauzo.push(mauzoMpya);
  localStorage.setItem('vijiMauzo', JSON.stringify(mauzo));
}

// PAKIA UKURASA UNAPOFUNGUKA
pakiaSkills();
</script>
</body>
</html>
