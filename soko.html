<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soko</title>
<style>
body{background:#0f172a;color:white;padding:15px;font-family:Arial}
.box{background:#1e293b;padding:20px;border-radius:15px;margin-bottom:15px}
input,textarea{width:100%;padding:14px;margin:8px 0;background:#0f172a;border:1px solid #334155;border-radius:10px;color:white;font-size:16px}
.btn{width:100%;padding:15px;background:#10b981;color:white;border:none;border-radius:10px;font-weight:bold;font-size:17px}
.card{background:#1e293b;padding:15px;border-radius:12px;margin:10px 0}
</style>
</head>
<body>
<h2 style="color:#60a5fa">SOKO LA VIJI</h2>

<div class="box">
  <h3>Weka Bidhaa Yako</h3>
  <input id="jina" placeholder="Jina la bidhaa: Mfano Simu">
  <input id="bei" type="number" placeholder="Bei TZS: Mfano 200000">
  <input id="namba" placeholder="Namba yako ya M-Pesa/Tigo">
  <textarea id="maelezo" placeholder="Maelezo mafupi"></textarea>
  <button class="btn" onclick="weka()">Weka Sokoni</button>
</div>

<h3>Bidhaa Zilizopo</h3>
<div id="orodha"></div>

<script>
let bidhaa = JSON.parse(localStorage.getItem('vijiBidhaa')) || [];

function weka(){
  let b = {
    jina: document.getElementById('jina').value,
    bei: document.getElementById('bei').value,
    namba: document.getElementById('namba').value,
    maelezo: document.getElementById('maelezo').value
  };
  if(!b.jina || !b.bei){alert('Jaza jina na bei');return}
  bidhaa.push(b);
  localStorage.setItem('vijiBidhaa', JSON.stringify(bidhaa));
  onyesha();
  alert('Bidhaa imewekwa!');
}

function onyesha(){
  let html = '';
  bidhaa.forEach((b,i)=>{
    html += `<div class="card">
      <h4>${b.jina}</h4>
      <p><b>Bei:</b> ${b.bei} TZS</p>
      <p>${b.maelezo}</p>
      <p><b>Wasiliana:</b> ${b.namba}</p>
      <button style="background:#3b82f6;padding:10px;border:none;border-radius:8px;color:white" onclick="nunua('${b.namba}',${b.bei})">Nunua Sasa</button>
    </div>`
  });
  document.getElementById('orodha').innerHTML = html;
}

function nunua(namba,bei){
  alert('Lipa kwa: '+namba+'\nKiasi: '+bei+' TZS\nBaada ya kulipa mpe ushahidi muuzaji');
}

onyesha();
</script>
</body>
</html>
