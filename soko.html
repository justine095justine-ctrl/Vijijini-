<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIJI SOKONI</title>
<style>
body{background:#0f172a;color:white;padding:20px;font-family:Arial}
h2{text-align:center;color:#3b82f6}
.card{background:#1e293b;padding:15px;border-radius:12px;margin:15px 0}
.card h3{color:#f59e0b;margin:0}
.whatsapp-btn{background:#25D366;color:white;padding:12px;text-align:center;border-radius:8px;text-decoration:none;display:block;margin-top:10px;font-weight:bold}
</style>
</head>
<body>

<h2>🛒 VIJI SOKONI</h2>
<p style="text-align:center">Nunua/Uza vitu vyako hapa</p>

<div class="card">
  <h3>Viatu Nike Size 42</h3>
  <p>Bei: 50,000 TZS</p>
  <p>Mwanza</p>
  <a href="https://wa.me/255653243898?text=Habari%20nahusika%20na%20Viatu%20Nike" class="whatsapp-btn" onclick="hifadhiMauzo('Viatu Nike', '50000')">Wasiliana WhatsApp</a>
</div>

<div class="card">
  <h3>Simu Samsung A12</h3>
  <p>Bei: 180,000 TZS</p>
  <p>DSM</p>
  <a href="https://wa.me/255653243898?text=Habari%20nahusika%20na%20Samsung%20A12" class="whatsapp-btn" onclick="hifadhiMauzo('Samsung A12', '180000')">Wasiliana WhatsApp</a>
</div>

<a href="index.html" style="color:#94a3b8">← Rudi Nyuma</a>

<script>
function hifadhiMauzo(bidhaa, bei){
  let mauzo = JSON.parse(localStorage.getItem('vijiMauzo')) || [];
  let mauzoMpya = {
    id: Date.now(),
    bidhaa: bidhaa,
    bei: bei,
    tarehe: new Date().toLocaleString('sw-TZ'),
    status: 'Inasubiri'
  };
  mauzo.push(mauzoMpya);
  localStorage.setItem('vijiMauzo', JSON.stringify(mauzo));
}
</script>
</body>
</html>
