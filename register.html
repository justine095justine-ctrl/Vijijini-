<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jisajili - VIJI APP</title>
<style>
/* style ileile ya login */
*{box-sizing:border-box}
body{background:#0f172a;color:white;font-family:'Segoe UI', Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:15px}
.box{background:#1e293b;padding:30px 25px;border-radius:20px;width:100%;max-width:420px}
h2{color:#10b981;text-align:center;font-size:26px}
label{display:block;color:#cbd5e1;font-size:15px;margin:15px 0 6px 0;font-weight:600}
input{width:100%;padding:16px;border-radius:12px;border:2px solid #334155;background:#0f172a;color:white;font-size:17px}
.btn{width:100%;padding:16px;background:linear-gradient(135deg, #10b981, #059669);color:white;border:none;border-radius:12px;font-weight:bold;font-size:18px;margin-top:15px}
.link{text-align:center;margin-top:15px;color:#60a5fa}
.link a{color:#60a5fa;font-weight:bold;text-decoration:none}
.msg{text-align:center;padding:14px;border-radius:10px;margin:12px 0;display:none;font-weight:600}
.msg.ok{background:#065f46;color:#d1fae5}
.msg.error{background:#7f1d1d;color:#fecaca}
</style>
</head>
<body>
<div class="box">
<h2>Jisajili Mpya</h2>
<p style="text-align:center;color:#94a3b8">Tengeneza akaunti yako</p>
<div id="msg" class="msg"></div>
<label>Jina Kamili</label>
<input type="text" id="jina" placeholder="Andika Jina lako">
<label>Namba ya Simu</label>
<input type="tel" id="namba" placeholder="+255 653 243 898">
<label>Nywila</label>
<input type="password" id="neno" placeholder="Weka nywila angalau 4">
<button class="btn" onclick="jisajili()">Maliza Usajili</button>
<p class="link">Una akaunti? <a href="login.html">Ingia hapa</a></p>
</div>
<script>
function jisajili(){
  let jina = document.getElementById('jina').value;
  let namba = document.getElementById('namba').value;
  let neno = document.getElementById('neno').value;
  if(jina.length < 3 || namba.length < 10 || neno.length < 4){ 
    document.getElementById('msg').innerText = 'Jaza taarifa zote sahihi';
    document.getElementById('msg').className = 'msg error';
    document.getElementById('msg').style.display = 'block'; 
    return; 
  }
  let userData = {jina:jina, neno:neno};
  localStorage.setItem('vijiUser_' + namba, JSON.stringify(userData));
  document.getElementById('msg').innerText = 'Usajili umefanikiwa! Sasa Ingia';
  document.getElementById('msg').className = 'msg ok';
  document.getElementById('msg').style.display = 'block';
  setTimeout(()=>{window.location='login.html'}, 1500);
}
</script>
</body>
</html>
