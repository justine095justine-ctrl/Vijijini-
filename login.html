<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingia - VIJI APP</title>
<style>
*{box-sizing:border-box}
body{background:#0f172a;color:white;font-family:'Segoe UI', Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:15px}
.box{background:#1e293b;padding:30px 25px;border-radius:20px;width:100%;max-width:420px}
h2{color:#60a5fa;text-align:center;font-size:26px}
label{display:block;color:#cbd5e1;font-size:15px;margin:15px 0 6px 0;font-weight:600}
input{width:100%;padding:16px;border-radius:12px;border:2px solid #334155;background:#0f172a;color:white;font-size:17px}
.btn{width:100%;padding:16px;background:linear-gradient(135deg, #3b82f6, #2563eb);color:white;border:none;border-radius:12px;font-weight:bold;font-size:18px;margin-top:15px}
.link{text-align:center;margin-top:15px;color:#60a5fa}
.link a{color:#60a5fa;font-weight:bold;text-decoration:none}
.msg{text-align:center;padding:14px;border-radius:10px;margin:12px 0;display:none;font-weight:600}
.msg.error{background:#7f1d1d;color:#fecaca}
</style>
</head>
<body>
<div class="box">
<h2>Ingia</h2>
<p style="text-align:center;color:#94a3b8">Karibu tena VIJI APP</p>
<div id="msg" class="msg"></div>
<label>Namba ya Simu</label>
<input type="tel" id="namba" placeholder="+255 653 243 898">
<label>Nywila</label>
<input type="password" id="neno" placeholder="Weka nywila yako">
<button class="btn" onclick="ingia()">Ingia</button>
<p class="link">Huna akaunti? <a href="register.html">Jisajili hapa</a></p>
</div>
<script>
function ingia(){
  let namba = document.getElementById('namba').value;
  let neno = document.getElementById('neno').value;
  let userData = JSON.parse(localStorage.getItem('vijiUser_' + namba));
  if(userData && userData.neno === neno){
    localStorage.setItem('vijiUserLogin', namba);
    window.location = 'index.html';
  } else {
    document.getElementById('msg').innerText = 'Namba au Nywila si sahihi';
    document.getElementById('msg').style.display = 'block';
  }
}
if(localStorage.getItem('vijiUserLogin')){ window.location = 'index.html'; }
</script>
</body>
</html>
