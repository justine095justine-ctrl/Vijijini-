<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIJI APP</title>
<style>
*{box-sizing:border-box}
body{background:#0f172a;color:white;font-family:'Segoe UI', Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:15px}
.box{background:#1e293b;padding:30px 25px;border-radius:20px;width:100%;max-width:420px}
.note{background:#1e3a8a;padding:14px;border-radius:10px;text-align:center;margin-bottom:20px;color:#60a5fa;font-weight:600}
.tabs{display:flex;background:#0f172a;border-radius:10px;margin-bottom:20px;padding:4px}
.tab{flex:1;padding:12px;text-align:center;border-radius:8px;cursor:pointer;font-weight:bold}
.tab.active{background:#3b82f6;color:white}
.form{display:none}
.form.active{display:block}
label{display:block;color:#cbd5e1;font-size:15px;margin:15px 0 6px 0;font-weight:600}
input{width:100%;padding:16px;border-radius:12px;border:2px solid #334155;background:#0f172a;color:white;font-size:17px}
.btn{width:100%;padding:16px;background:linear-gradient(135deg, #3b82f6, #2563eb);color:white;border:none;border-radius:12px;font-weight:bold;font-size:18px;margin-top:15px}
.msg{text-align:center;padding:14px;border-radius:10px;margin:12px 0;display:none;font-weight:600}
.msg.ok{background:#065f46;color:#d1fae5}
.msg.error{background:#7f1d1d;color:#fecaca}
</style>
</head>
<body>
<div class="box">
<div class="note">Tunakata 5% tu kwenye kila mauzo</div>

<div class="tabs">
  <div class="tab active" onclick="showTab('ingia')">Ingia</div>
  <div class="tab" onclick="showTab('jisajili')">Jisajili</div>
</div>

<div id="msg" class="msg"></div>

<!-- FOMU YA KUINGIA -->
<div id="ingia" class="form active">
  <h2 style="text-align:center;color:#60a5fa">Karibu Tena</h2>
  <label>Namba ya Simu</label>
  <input type="tel" id="nambaIngia" placeholder="+255 653 243 898">
  <label>Nywila</label>
  <input type="password" id="nenoIngia" placeholder="Andika Nywila yako">
  <button class="btn" onclick="fanyaIngia()">Ingia</button>
</div>

<!-- FOMU YA KUJISAJILI -->
<div id="jisajili" class="form">
  <h2 style="text-align:center;color:#10b981">Tengeneza Akaunti</h2>
  <label>Jina Kamili</label>
  <input type="text" id="jinaReg" placeholder="Andika Jina lako">
  <label>Namba ya Simu</label>
  <input type="tel" id="nambaReg" placeholder="+255 653 243 898">
  <label>Nywila</label>
  <input type="password" id="nenoReg" placeholder="Weka nywila angalau 4">
  <button class="btn" style="background:linear-gradient(135deg, #10b981, #059669)" onclick="fanyaJisajili()">Maliza Usajili</button>
</div>

</div>

<script>
// Kubadilisha kati ya Ingia na Jisajili
function showTab(tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.form').forEach(f=>f.classList.remove('active'));
  document.querySelector(`.tab:nth-child(${tab=='ingia'?1:2})`).classList.add('active');
  document.getElementById(tab).classList.add('active');
  document.getElementById('msg').style.display='none';
}

function showMsg(text, type){
  let m = document.getElementById('msg');
  m.innerText = text;
  m.className = 'msg ' + type;
  m.style.display = 'block';
}

// KAZI YA KUJISAJILI
function fanyaJisajili(){
  let jina = document.getElementById('jinaReg').value;
  let namba = document.getElementById('nambaReg').value;
  let neno = document.getElementById('nenoReg').value;
  if(jina.length < 3 || namba.length < 10 || neno.length < 4){ 
    showMsg('Jaza taarifa zote sahihi', 'error'); return; 
  }
  let userData = {jina:jina, neno:neno};
  localStorage.setItem('vijiUser_' + namba, JSON.stringify(userData));
  showMsg('Usajili umefanikiwa! Sasa Ingia', 'ok');
  setTimeout(()=>showTab('ingia'), 1500);
}

// KAZI YA KUINGIA
function fanyaIngia(){
  let namba = document.getElementById('nambaIngia').value;
  let neno = document.getElementById('nenoIngia').value;
  let userData = JSON.parse(localStorage.getItem('vijiUser_' + namba));
  if(userData && userData.neno === neno){
    localStorage.setItem('vijiUserLogin', namba);
    window.location = 'index.html';
  } else {
    showMsg('Namba au Nywila si sahihi', 'error');
  }
}

if(localStorage.getItem('vijiUserLogin')){ window.location = 'index.html'; }
</script>
</body>
</html>
