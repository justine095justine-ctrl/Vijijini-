<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIJI ADMIN</title>
<style>
body{background:#0f172a;color:white;padding:20px;font-family:Arial}
h2{text-align:center;color:#f59e0b}
.card{background:#1e293b;padding:15px;border-radius:12px;margin:15px 0}
.card h3{color:#3b82f6;margin:5px 0}
.status-pending{color:#f59e0b}
.status-done{color:#10b981}
.btn-group{display:flex;gap:10px;margin-top:10px}
.btn{flex:1;padding:10px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.btn-done{background:#10b981;color:white}
.btn-delete{background:#ef4444;color:white}
.btn-clear{background:#64748b;color:white;width:100%;margin-top:20px;padding:12px}
</style>
</head>
<body>

<h2>📊 VIJI ADMIN</h2>
<p style="text-align:center">Hapa ndio unaona mauzo yote</p>

<button class="btn btn-clear" onclick="futaZote()">🗑️ FUTA MAUZO YOTE</button>

<div id="orodhaMauzo"></div>

<a href="index.html" style="color:#94a3b8">← Rudi Nyuma</a>

<script>
// PAKIA MAUZO
function pakiaMauzo(){
  let mauzo = JSON.parse(localStorage.getItem('vijiMauzo')) || [];
  let div = document.getElementById('orodhaMauzo');
  div.innerHTML = '';
  
  if(mauzo.length == 0){
    div.innerHTML = '<p style="text-align:center;color:#94a3b8">Hakuna mauzo bado</p>';
    return;
  }
  
  mauzo.forEach(m => {
    let statusClass = m.status == 'Imekamilika' ? 'status-done' : 'status-pending';
    div.innerHTML += `
    <div class="card" id="mauzo-${m.id}">
      <h3>${m.bidhaa}</h3>
      <p>Bei: ${parseInt(m.bei).toLocaleString()} TZS</p>
      <p>Tarehe: ${m.tarehe}</p>
      <p>Status: <b class="${statusClass}">${m.status}</b></p>
      <div class="btn-group">
        <button class="btn btn-done" onclick="badiliStatus(${m.id})">✓ IMEKAMILIKA</button>
        <button class="btn btn-delete" onclick="futaMauzo(${m.id})">🗑️ FUTA</button>
      </div>
    </div>
    `;
  });
}

// BADILI STATUS KUWA IMEKAMILIKA
function badiliStatus(id){
  let mauzo = JSON.parse(localStorage.getItem('vijiMauzo')) || [];
  mauzo = mauzo.map(m => {
    if(m.id == id) m.status = 'Imekamilika';
    return m;
  });
  localStorage.setItem('vijiMauzo', JSON.stringify(mauzo));
  pakiaMauzo();
}

// FUTA MAUZO 1 MOJA
function futaMauzo(id){
  if(confirm('Una uhakika unataka kufuta mauzo haya?')){
    let mauzo = JSON.parse(localStorage.getItem('vijiMauzo')) || [];
    mauzo = mauzo.filter(m => m.id != id);
    localStorage.setItem('vijiMauzo', JSON.stringify(mauzo));
    pakiaMauzo();
  }
}

// FUTA MAUZO YOTE
function futaZote(){
  if(confirm('Una uhakika unataka kufuta mauzo YOTE? Hayataweza kurejeshwa')){
    localStorage.removeItem('vijiMauzo');
    pakiaMauzo();
  }
}

// PAKIA UKURASA UNAPOFUNGUKA
pakiaMauzo();
</script>
</body>
</html>
