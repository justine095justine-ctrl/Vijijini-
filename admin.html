<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIJI ADMIN</title>
<style>
body{background:#0f172a;color:white;padding:20px;font-family:Arial}
h2{text-align:center;color:#f59e0b}
.card{background:#1e293b;padding:15px;border-radius:12px;margin:15px 0;position:relative}
.card h3{color:#3b82f6;margin:5px 0}
.card img{width:100%;border-radius:10px;margin-bottom:10px;height:200px;object-fit:cover}
.btn-delete{position:absolute;top:10px;right:10px;background:#ef4444;color:white;border:none;padding:8px 12px;border-radius:5px;cursor:pointer;font-weight:bold}
.btn-clear{background:#ef4444;color:white;width:100%;margin-top:20px;padding:15px;border:none;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>

<h2>⚙️ VIJI ADMIN PANEL</h2>
<p style="text-align:center;color:#94a3b8">Unaweza kufuta bidhaa yoyote</p>
<button class="btn-clear" onclick="futaZote()">🗑️ FUTA BIDHAA ZOTE</button>
<div id="orodhaBidhaaAdmin"></div>
<a href="index.html" style="color:#94a3b8">← Rudi Nyuma</a>

<script>
function pakiaAdmin(){
  let bidhaa = JSON.parse(localStorage.getItem('vijiBidhaa')) || [];
  let div = document.getElementById('orodhaBidhaaAdmin');
  div.innerHTML = '';
  if(bidhaa.length == 0){div.innerHTML = '<p style="text-align:center;color:#94a3b8">Hakuna bidhaa</p>';}

  bidhaa.forEach(b => {
    div.innerHTML += `
    <div class="card">
      <button class="btn-delete" onclick="futaBidhaaAdmin(${b.id})">FUTA</button>
      <img src="${b.picha}" alt="${b.jina}">
      <h3>${b.jina}</h3>
      <p>Bei: ${parseInt(b.bei).toLocaleString()} TZS</p>
      <p>Mkoa: ${b.mkoa}</p>
      <p style="font-size:12px;color:#64748b">ID ya Mwenye: ${b.mwenyeBidhaa}</p>
    </div>
    `;
  });
}

function futaBidhaaAdmin(id){
  if(confirm('Admin: Una uhakika kufuta bidhaa hii?')){
    let bidhaa = JSON.parse(localStorage.getItem('vijiBidhaa')) || [];
    bidhaa = bidhaa.filter(b => b.id!= id);
    localStorage.setItem('vijiBidhaa', JSON.stringify(bidhaa));
    pakiaAdmin();
  }
}

function futaZote(){
  if(confirm('ADMIN: Futa BIDHAA ZOTE? Kitendo hiki hakiwezi kurejeshwa')){
    localStorage.removeItem('vijiBidhaa');
    pakiaAdmin();
  }
}
pakiaAdmin();
</script>
</body>
</html>
