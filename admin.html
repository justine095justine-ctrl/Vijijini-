<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN PANEL - VIJI</title>
<style>
body{background:#0f172a;color:white;font-family:Arial;padding:20px}
h1{color:#ef4444;text-align:center}
.login-box{background:#1e293b;padding:20px;border-radius:12px;max-width:400px;margin:50px auto;text-align:center}
input{width:90%;padding:12px;margin:10px 0;border-radius:8px;border:none;background:#334155;color:white}
.btn{background:#ef4444;color:white;padding:12px 20px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;width:100%}
.panel{display:none}
.card{background:#1e293b;padding:15px;border-radius:12px;margin:10px 0;overflow-x:auto}
.stat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:20px 0}
.stat-box{background:#1e293b;padding:15px;border-radius:12px;text-align:center}
.stat-box h3{color:#10b981;margin:0;font-size:24px}
table{width:100%;background:#1e293b;border-radius:12px;overflow:hidden}
th,td{padding:10px;text-align:left;border-bottom:1px solid #334155;font-size:14px}
th{background:#334155;color:#f59e0b}
</style>
</head>
<body>

<h1>🔐 ADMIN PANEL</h1>

<div class="login-box" id="loginBox">
  <h2>Ingia Admin</h2>
  <input type="password" id="password" placeholder="Weka Password ya Admin">
  <button class="btn" onclick="login()">INGIA</button>
  <p style="font-size:12px;color:#94a3b8">Password default: viji2026</p>
</div>

<div class="panel" id="adminPanel">
  <div class="stat">
    <div class="stat-box"><p>Mauzo Yote</p><h3>0</h3></div>
    <div class="stat-box"><p>Watumiaji</p><h3>0</h3></div>
    <div class="stat-box"><p>TZS Imeingia</p><h3>0 TZS</h3></div>
  </div>

  <div class="card">
    <h2>📋 Mauzo ya Hivi Karibuni</h2>
    <table id="jedwaliMauzo">
      <tr><th>Namba</th><th>Bidhaa/Huduma</th><th>Bei</th><th>Tarehe</th><th>Status</th></tr>
    </table>
  </div>

  <div class="card">
    <h2>⚙️ Mipangilio</h2>
    <p>Kata asilimia yako: <b>5%</b></p>
    <button class="btn" style="background:#64748b" onclick="logout()">TOKA</button>
  </div>
</div>

<script>
function login(){
  let pass = document.getElementById('password').value;
  if(pass === 'viji2026'){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('adminPanel').style.display='block';
    pakiaMauzo();
  } else {
    alert('❌ Password si sahihi!');
  }
}
function logout(){
  document.getElementById('loginBox').style.display='block';
  document.getElementById('adminPanel').style.display='none';
  document.getElementById('password').value='';
}

function pakiaMauzo(){
  let mauzo = JSON.parse(localStorage.getItem('vijiMauzo')) || [];
  let table = document.getElementById('jedwaliMauzo');
  let jumla = 0;
  
  table.innerHTML = '<tr><th>Namba</th><th>Bidhaa/Huduma</th><th>Bei</th><th>Tarehe</th><th>Status</th></tr>';
  
  mauzo.reverse().forEach((m, index) => {
    let row = table.insertRow();
    jumla += parseInt(m.bei);
    row.innerHTML = `
      <td>#${index+1}</td>
      <td>${m.bidhaa}</td>
      <td>${parseInt(m.bei).toLocaleString()} TZS</td>
      <td>${m.tarehe}</td>
      <td style="color:#f59e0b">${m.status}</td>
    `;
  });
  
  document.querySelectorAll('.stat-box h3')[0].innerText = mauzo.length;
  document.querySelectorAll('.stat-box h3')[2].innerText = jumla.toLocaleString() + ' TZS';
}
</script>
</body>
</html>
